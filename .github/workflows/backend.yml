name: Backend CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:

#   test:
#     name: Run Tests
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v4
#       - uses: actions/setup-python@v5
#         with:
#           python-version: "3.11"
#           cache: "pip"
#       - run: pip install -r requirements.txt pytest pytest-asyncio httpx
#       - run: pytest tests/ -v --tb=short

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Calculate version using GitVersion
  # ───────────────────────────────────────────────────────────────────────────
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    outputs:
      semver: ${{ steps.gitversion.outputs.semver }}
      image_tag: ${{ steps.image_tag.outputs.tag }}

    steps:
      - name: Checkout (full history required for GitVersion)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # GitVersion needs full git history
          fetch-tags: true      # and all tags

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: "5.x"

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Set image tag
        id: image_tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            # Production: clean semver  e.g. 1.0.0
            echo "tag=${{ steps.gitversion.outputs.majorMinorPatch }}" >> $GITHUB_OUTPUT
          else
            # Dev: prefixed semver  e.g. dev-1.0.0-dev.5
            echo "tag=dev-${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          fi

      - name: Print version info
        run: |
          echo "SemVer:    ${{ steps.gitversion.outputs.semVer }}"
          echo "Image tag: ${{ steps.image_tag.outputs.tag }}"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker image to Docker Hub
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: version
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ needs.version.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          # Three tags per build:
          #   1. versioned tag  e.g. dev-1.0.0-dev.5  or  1.0.0
          #   2. branch tag     e.g. dev               or  latest
          #   3. commit SHA     e.g. abc1234  (always unique, useful for rollback)
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:${{ needs.version.outputs.image_tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:sha-${{ github.sha }}
          # Registry cache — makes subsequent builds much faster
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:buildcache,mode=max

      - name: Print image tags
        run: |
          echo "Pushed tags:"
          echo "  ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:${{ needs.version.outputs.image_tag }}"
          echo "  ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
          echo "  ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:sha-${{ github.sha }}"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3a: Deploy to Dev VM (develop branch — automatic)
  #
  # Uses docker-compose.prod.yml (no build, pulls image)
  # Image tag: dev-x.x.x-dev.n
  # Directory: /home/spiderman/aicaller/dev
  # ───────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [version, build-and-push]
    if: github.ref_name == 'develop'
    environment:
      name: backend-dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          source: "docker/"
          target: "/home/spiderman/aicaller/dev/"

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            set -e
            mkdir -p /home/spiderman/aicaller/dev
            cd /home/spiderman/aicaller/dev

            # Write .env with exact versioned image tag
            cat > docker/.env << EOF
            ENV=development
            IMAGE_TAG=${{ needs.version.outputs.image_tag }}
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}
            AZURE_SPEECH_REGION=${{ secrets.AZURE_SPEECH_REGION }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            API_DOMAIN=${{ secrets.API_DOMAIN }}
            EOF

            # Pull the exact versioned image
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            docker compose -f docker/docker-compose.prod.yml pull api redis 
            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans traefik api redis

            # Health check
            sleep 10
            curl -f http://localhost/health || (docker compose -f docker/docker-compose.prod.yml logs api && exit 1)

            echo "Dev deploy successful! Version: ${{ needs.version.outputs.image_tag }}"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3b: Deploy to Prod VM (main branch — requires manual approval)
  #
  # Uses docker-compose.prod.yml (no build, pulls image)
  # Image tag: x.x.x  (clean semver)
  # Directory: /home/spiderman/aicaller/prod
  # ───────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [version, build-and-push]
    if: github.ref_name == 'main'
    # This pauses and waits for manual approval in GitHub UI
    environment:
      name: backend-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          source: "docker/"
          target: "/home/spiderman/aicaller/prod/"

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            set -e
            mkdir -p /home/spiderman/aicaller/prod
            cd /home/spiderman/aicaller/prod

            cat > docker/.env << EOF
            ENV=production
            IMAGE_TAG=${{ needs.version.outputs.image_tag }}
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}
            AZURE_SPEECH_REGION=${{ secrets.AZURE_SPEECH_REGION }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            API_DOMAIN=${{ secrets.API_DOMAIN }}
            EOF

            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            docker compose -f docker/docker-compose.prod.yml pull api redis
            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans traefik api redis

            sleep 15
            curl -f http://${{ secrets.API_DOMAIN }}/health || (docker compose -f docker/docker-compose.prod.yml logs api && exit 1)

            # Clean up old untagged images to save disk space
            docker image prune -f

            echo "Production deploy successful! Version: ${{ needs.version.outputs.image_tag }}"