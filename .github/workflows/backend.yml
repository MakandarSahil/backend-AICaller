name: Backend CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# FLOW:
#
#   develop push / PR
#     └── version → build-only
#         Builds image, pushes to Docker Hub as dev-x.x.x-dev.n
#         Validates code — no deployment.
#         PRs to develop must pass this before merge is allowed.
#
#   main push (merge from develop)
#     └── version → build-and-push → deploy-prod (manual approval gate)
#         Builds image tagged x.x.x (clean semver)
#         Pauses for your approval in GitHub UI
#         On approval: deploys to Azure VM
#
# VERSIONING (GitVersion):
#   develop → dev-1.0.0-dev.5
#   main    → 1.0.0  (bump with +semver:minor or +semver:major in commit)
#
# LOCAL DEV:
#   docker compose -f docker/docker-compose.dev.yml up --build traefik api redis
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:

  # ── Placeholder — add real tests in Phase 3 ───────────────────────────────
  # test:
  #   name: Run Tests
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with: { python-version: "3.11", cache: "pip" }
  #     - run: pip install -r requirements.txt pytest pytest-asyncio httpx
  #     - run: pytest tests/ -v --tb=short

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Calculate version (runs on all branches and PRs)
  # ───────────────────────────────────────────────────────────────────────────
  version:
    name: Calculate Version
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
      semver: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - name: Checkout (full history for GitVersion)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: "5.x"

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Set image tag
        id: image_tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            # Clean semver for prod — e.g. 1.0.0
            echo "tag=${{ steps.gitversion.outputs.majorMinorPatch }}" >> $GITHUB_OUTPUT
          else
            # Prefixed for dev — e.g. dev-1.0.0-dev.5
            echo "tag=dev-${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          fi

      - name: Print version
        run: |
          echo "Branch:    ${{ github.ref_name }}"
          echo "SemVer:    ${{ steps.gitversion.outputs.semVer }}"
          echo "Image tag: ${{ steps.image_tag.outputs.tag }}"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2a — Build only (develop branch + all PRs)
  # Validates the image builds. No deployment.
  # This is the gate PRs must pass before merging to develop.
  # ───────────────────────────────────────────────────────────────────────────
  build-only:
    name: Build & Validate Image
    runs-on: ubuntu-latest
    needs: version
    if: github.ref_name == 'develop' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:${{ needs.version.outputs.image_tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:dev
            ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:buildcache,mode=max

      - name: Validate
        run: |
          echo "✅ Image built successfully — ${{ needs.version.outputs.image_tag }}"
          echo "   Dockerfile valid, dependencies installed, app importable."
          echo "   Merge to main to trigger production deployment."

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2b — Build & Push prod image (main branch only)
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    needs: version
    if: github.ref_name == 'main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ needs.version.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # 3 tags every prod build:
          #   1.0.0       — versioned (use this for rollback)
          #   latest      — always newest prod
          #   sha-abc123  — commit SHA (guaranteed unique)
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:${{ needs.version.outputs.image_tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/aicaller-backend:buildcache,mode=max

      - name: Print tags
        run: |
          echo "✅ Production image pushed:"
          echo "   :${{ needs.version.outputs.image_tag }}"
          echo "   :latest"
          echo "   :sha-${{ github.sha }}"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to Production (main only, manual approval gate)
  #
  # PAUSES here — go to GitHub → Actions → this run → Review deployments
  # tick backend-production → Approve and deploy
  # ───────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [version, build-and-push]
    if: github.ref_name == 'main' && github.event_name == 'push'
    environment:
      name: backend-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: "docker/"
          target: "~/aicaller/prod/"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            mkdir -p $HOME/aicaller/prod/docker

            # Write .env next to the compose file so docker compose picks it up
            cat > $HOME/aicaller/prod/docker/.env << EOF
            ENV=production
            IMAGE_TAG=${{ needs.version.outputs.image_tag }}
            DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}
            AZURE_SPEECH_REGION=${{ secrets.AZURE_SPEECH_REGION }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            API_DOMAIN=${{ secrets.API_DOMAIN }}
            EOF

            cd $HOME/aicaller/prod

            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            docker compose -p aicaller -f docker/docker-compose.prod.yml pull
            docker compose -p aicaller -f docker/docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting for health check..."
            sleep 15
            curl -f http://localhost/health || (docker compose -p aicaller -f docker/docker-compose.prod.yml logs --tail=50 api && exit 1)

            docker image prune -f

            echo "✅ Production deploy successful! Version: ${{ needs.version.outputs.image_tag }}"