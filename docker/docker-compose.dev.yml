# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml
#
# LOCAL DEVELOPMENT ONLY — never used on VM.
# VM always uses docker-compose.prod.yml.
#
# Features vs prod:
#   - Builds image locally from Dockerfile (no pre-built image needed)
#   - Hot reload via uvicorn --reload (save a file → instant restart)
#   - Source code mounted so changes apply without rebuilding
#   - Traefik dashboard at http://localhost:8080
#   - Direct API access at http://localhost:8000 (bypasses Traefik)
#   - Celery worker with hot reload for task development
#
# Usage:
#   # Start all services (first time or after requirements.txt change):
#   docker compose -f docker/docker-compose.dev.yml up --build
#
#   # Start (normal, no rebuild):
#   docker compose -f docker/docker-compose.dev.yml up
#
#   # Stop:
#   docker compose -f docker/docker-compose.dev.yml down
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Traefik ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6.5
    container_name: aicaller_traefik_dev
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=aicaller_dev_net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"    # Traefik dashboard — dev only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs_dev:/letsencrypt
    networks:
      - aicaller_dev_net

  # ── FastAPI ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..          # repo root — where Dockerfile lives
      dockerfile: Dockerfile
    container_name: aicaller_api_dev
    restart: unless-stopped
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    volumes:
      - ../app:/app/app:ro
      - ../logs:/app/logs
    env_file:
      - ../.env
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aicaller_dev_net
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aicaller_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_dev:/data
    networks:
      - aicaller_dev_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Celery Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aicaller_worker_dev
    restart: unless-stopped
    command: >
      celery -A app.tasks.conversation.celery_app worker
      --loglevel=debug
      --concurrency=2
    volumes:
      - ../app:/app/app:ro
    env_file:
      - ../.env
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aicaller_dev_net
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  aicaller_dev_net:
    name: aicaller_dev_net
    driver: bridge

volumes:
  redis_data_dev:
    name: aicaller_redis_data_dev
  traefik_certs_dev:
    name: aicaller_traefik_certs_dev