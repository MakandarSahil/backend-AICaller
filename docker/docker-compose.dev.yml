# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.dev.yml
#
# LOCAL DEVELOPMENT ONLY — never used on VM.
# VM deployments always use docker-compose.prod.yml.
#
# Features:
#   - Builds image locally from Dockerfile
#   - Hot reload via --reload (code changes apply instantly)
#   - Source code mounted so changes reflect without rebuild
#   - Traefik dashboard exposed at http://localhost:8080
#
# Usage:
#   docker compose -f docker/docker-compose.dev.yml up --build
#   docker compose -f docker/docker-compose.dev.yml up --build traefik api redis
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Traefik ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6.5
    container_name: aicaller_traefik_dev
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=aicaller_dev_net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"     # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs_dev:/letsencrypt
    networks:
      - aicaller_dev_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ── FastAPI ────────────────────────────────────────────────────────────────
  api:
    # Builds from local Dockerfile — for local dev only
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aicaller_api_dev
    restart: unless-stopped
    # Override CMD: use --reload for hot reload during development
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
    volumes:
      # Mount source so file changes reflect instantly without rebuilding
      - ../app:/app/app:ro
    env_file:
      - ../.env
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aicaller_dev_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aicaller_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_dev:/data
    networks:
      - aicaller_dev_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Celery Worker (Phase 3 — uncomment when pipeline is ready) ─────────────
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: Dockerfile
  #   container_name: aicaller_worker_dev
  #   restart: unless-stopped
  #   command: >
  #     celery -A app.workers.celery_app worker
  #     --loglevel=info
  #     --concurrency=2
  #   volumes:
  #     - ../app:/app/app:ro
  #   env_file:
  #     - ../.env
  #   environment:
  #     - ENV=development
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - aicaller_dev_net
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512M

networks:
  aicaller_dev_net:
    name: aicaller_dev_net
    driver: bridge

volumes:
  redis_data_dev:
    name: aicaller_redis_data_dev
  traefik_certs_dev:
    name: aicaller_traefik_certs_dev