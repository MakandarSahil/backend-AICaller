# docker/traefik/traefik.dev.yml
# Traefik static configuration for development
# This file is mounted into the Traefik container at /etc/traefik/traefik.yml

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

api:
  dashboard: true
  insecure: true   # allows http access to dashboard in dev

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: aicaller_dev_net
  file:
    directory: /etc/traefik/dynamic
    watch: true